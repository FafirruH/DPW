<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS | Login Petugas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html">SIMPUS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="buku/tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="anggota/tambah.html">Tambah Anggota</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <section class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4 fw-bold" style="color:#1d5b8a;">Login Petugas</h2>
                        <form action="dashboard.html" method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required>
                            </div>
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn text-white" style="background-color:#1d5b8a;">Masuk</button>
                            </div>
                        </form>
                        <div class="text-center mt-3 fs-6">
                            <span class="text-secondary">Belum punya akun?</span> 
                            <a href="registrasi.html" class="fw-medium" style="color:#1d5b8a;">Daftar di sini</a>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS &mdash; Jobsheet 4</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
