<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header
      class="navbar navbar-expand-lg navbar-dark"
      style="background-color: #1d5b8a"
    >
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../buku/list.html">Daftar Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../buku/tambah.html">Tambah Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="list.html">Daftar Anggota</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tambah.html">Tambah Anggota</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../login.html">Login</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container my-4">
      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <div
            class="d-flex justify-content-between align-items-center mb-3 card-title-container"
          >
            <h2 class="card-title mb-0 fw-bold" style="color: #1d5b8a">
              Daftar Anggota
            </h2>
            <a
              href="tambah.html"
              class="btn text-white"
              style="background-color: #1d5b8a"
              >+ Tambah Anggota</a
            >
          </div>
          <div class="search-box mb-3">
            <label for="search-input" class="form-label"
              >Cari Nama Anggota</label
            >
            <input
              type="text"
              class="form-control"
              id="search-input"
              placeholder="Ketik Nama Anggota..."
            />
          </div>
        </div>
        <p id="loading-indicator" style="display: none">Memuat data...</p>
        <div class="table-responsive">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>No. Anggota</th>
                  <th>Nama</th>
                  <th>Alamat</th>
                  <th>No. HP</th>
                  <th class="text-center">Aksi</th>
                </tr>
              </thead>
              <tbody>
                
              </tbody>
            </table>
          </div>
        </div>
      </section>

    <footer>
      <p>&copy; 2026 SIMPUS &mdash; Jobsheet 6</p>
